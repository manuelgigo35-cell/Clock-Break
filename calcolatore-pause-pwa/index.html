<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Calcolatore rapido delle pause da 15 o 30 minuti.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Pausa</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(440px,100%);background:white;border-radius:24px;padding:26px;box-shadow:0 10px 35px #00000012}
h1{margin:0 0 6px;font-size:30px}.sub{margin:0 0 24px;color:#6b7280}
label{display:block;font-weight:650;margin:16px 0 8px}
input,select,button{width:100%;min-height:52px;border:1px solid #d1d5db;border-radius:14px;padding:0 15px;font-size:18px;background:white}
.result{margin-top:24px;padding:24px;border-radius:20px;background:#f3f4f6;text-align:center}
.result small{color:#6b7280}.time{font-size:52px;font-weight:800;line-height:1.1;margin:7px 0}
.summary{color:#6b7280}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{cursor:pointer;background:#111827;color:white;border:0;font-weight:700}
button.secondary{background:#e5e7eb;color:#111827}
.install{margin-top:18px;font-size:14px;color:#6b7280;text-align:center}
@media(max-width:360px){.card{padding:20px}.time{font-size:44px}}
</style>
</head>
<body>
<main><section class="card">
<h1>⏱️ Calcolatore pausa</h1>
<p class="sub">Scegli quando inizia la pausa e quanto dura.</p>

<label for="start">Orario di inizio</label>
<input id="start" type="time" value="09:00">

<label for="duration">Durata</label>
<select id="duration">
<option value="15">15 minuti</option>
<option value="30">30 minuti</option>
</select>

<div class="result" aria-live="polite">
<small>La pausa termina alle</small>
<div id="end" class="time">09:15</div>
<div id="summary" class="summary">09:00 → 09:15 · 15 minuti</div>
</div>

<div class="actions">
<button id="now">Ora attuale</button>
<button id="reset" class="secondary">Reset</button>
</div>
<div class="install">Puoi aggiungere questa pagina alla schermata Home per usarla come un'app.</div>
</section></main>
<script>
const start=document.querySelector('#start'),duration=document.querySelector('#duration');
const end=document.querySelector('#end'),summary=document.querySelector('#summary');
function calc(){
 const [h,m]=start.value.split(':').map(Number), d=Number(duration.value);
 if(!Number.isFinite(h)||!Number.isFinite(m)) return;
 const t=(h*60+m+d)%1440, eh=Math.floor(t/60), em=t%60;
 const e=String(eh).padStart(2,'0')+':'+String(em).padStart(2,'0');
 end.textContent=e; summary.textContent=start.value+' → '+e+' · '+d+' minuti';
}
start.addEventListener('input',calc); duration.addEventListener('change',calc);
document.querySelector('#now').addEventListener('click',()=>{
 const d=new Date(); start.value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); calc();
});
document.querySelector('#reset').addEventListener('click',()=>{start.value='09:00';duration.value='15';calc()});
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
calc();
</script>
</body>
</html>
